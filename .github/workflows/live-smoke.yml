name: Live smoke test
on:
  push:
    branches: ["claude/live-smoke*"]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Image pulls anonymously (both architectures)
        run: |
          tok=$(curl -fsS "https://ghcr.io/token?scope=repository:breakthrudevelopment/12-restaurant-ordering:pull" | jq -r .token)
          curl -fsS -H "Authorization: Bearer $tok" -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/breakthrudevelopment/12-restaurant-ordering/manifests/sha-cbd6f0f" | jq -r '.manifests[]?.platform | "\(.os)/\(.architecture)"'
      - name: Diagnose
        run: |
          ip=$(dig +short A app8.breakthruventures.ai | tail -1); echo "vm ip $ip"
          for h in app4.breakthruventures.ai app8.breakthruventures.ai app12.breakthruventures.ai restaurant-ordering.${ip//./-}.sslip.io nosuchapp.${ip//./-}.sslip.io; do
            echo "== $h"; dig +short A "$h"; dig +short AAAA "$h"
            curl -sS -m 20 -o /dev/null -w 'http %{http_code} -> %{redirect_url}\n' "http://$h/" || true
            curl -sS -m 20 -o /dev/null -w 'http-acme %{http_code}\n' "http://$h/.well-known/acme-challenge/probe" || true
            echo | timeout 20 openssl s_client -connect "$h:443" -servername "$h" 2>&1 | grep -E 'subject=|issuer=|alert|verify return' | head -4 || true
          done
          dig +short CAA breakthruventures.ai; dig +short CAA app12.breakthruventures.ai
          curl -sS -m 90 'https://crt.sh/?q=app12.breakthruventures.ai&output=json' | jq -r '.[] | "\(.entry_timestamp) \(.issuer_name)"' | head -5 || true
          curl -sS -m 90 'https://crt.sh/?q=app8.breakthruventures.ai&output=json' | jq -r '.[] | "\(.entry_timestamp) \(.issuer_name)"' | head -5 || true
      - name: Health
        if: ${{ hashFiles('.github/live-smoke-url') != '' }}
        run: |
          url="$(head -n1 .github/live-smoke-url | tr -d '[:space:]')"; echo "url=$url" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do curl -fsS -m 30 "$url/api/health" && exit 0; sleep 20; done; exit 1
      - name: Smoke
        if: ${{ hashFiles('.github/live-smoke-url') != '' }}
        run: BASE_URL="$url" bash scripts/smoke.sh
